<style>
/* Layout: navy side menu + working area; on phones the menu becomes a scrollable top bar and tables become cards */
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --ink:#1B2230; --muted:#5B6472; --line:#E3E6EB; --field:#D5DAE1;
  --brand:#12324F; --brand-2:#2F5E8C; --brand-soft:#E6EDF4; --nav-muted:#C9D4E0; --hover:#F8F9FB;
  --ok:#1E6B45; --ok-soft:#E3F3EA; --warn:#7A5200; --warn-soft:#FFF4D6; --bad:#B42318; --bad-soft:#FDECEA;
  --mute-soft:#EEF0F3; --gold:#B7862C; --overlay:rgba(15,23,35,.45);
  --cjm:#1E6B45; --cjm-bg:#E3F3EA; --cju:#1F5FA8; --cju-bg:#E3EEFB; --cjn:#6B3FA0; --cjn-bg:#EFE6FA; --tint-imp:#F6F1FC; --tint-imp-line:#E2D4F5; --tint-list:#F1F6FC; --tint-list-line:#D6E3F2;
  --font:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F151D; --surface:#17202B; --ink:#E8ECF1; --muted:#9AA5B3; --line:#263241; --field:#344356;
  --brand:#0B2238; --brand-2:#4A82BA; --brand-soft:#1F3550; --nav-muted:#AFC0D3; --hover:#1C2734;
  --ok:#7DD3A8; --ok-soft:#173226; --warn:#F2C96B; --warn-soft:#3A2E10; --bad:#F28B82; --bad-soft:#3A1E1C;
  --mute-soft:#222D3A; --gold:#E3B867; --overlay:rgba(0,0,0,.6); color-scheme:dark;
  --cjm:#7DD3A8; --cjm-bg:#173226; --cju:#8DB8EC; --cju-bg:#1B2F48; --cjn:#C4A6EE; --cjn-bg:#2D2240; --tint-imp:#1E1A2A; --tint-imp-line:#3A3150; --tint-list:#162433; --tint-list-line:#284058;}}
:root[data-theme="dark"]{
  --bg:#0F151D; --surface:#17202B; --ink:#E8ECF1; --muted:#9AA5B3; --line:#263241; --field:#344356;
  --brand:#0B2238; --brand-2:#4A82BA; --brand-soft:#1F3550; --nav-muted:#AFC0D3; --hover:#1C2734;
  --ok:#7DD3A8; --ok-soft:#173226; --warn:#F2C96B; --warn-soft:#3A2E10; --bad:#F28B82; --bad-soft:#3A1E1C;
  --mute-soft:#222D3A; --gold:#E3B867; --overlay:rgba(0,0,0,.6); color-scheme:dark;
  --cjm:#7DD3A8; --cjm-bg:#173226; --cju:#8DB8EC; --cju-bg:#1B2F48; --cjn:#C4A6EE; --cjn-bg:#2D2240; --tint-imp:#1E1A2A; --tint-imp-line:#3A3150; --tint-list:#162433; --tint-list-line:#284058;}
*{box-sizing:border-box}
[hidden]{display:none!important}
.mstrip{display:grid;grid-template-columns:repeat(12,22px);gap:4px}
.m{width:22px;height:24px;border-radius:6px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid transparent;line-height:1}
.s-pag{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.s-ade{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.s-par{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.s-ven{background:var(--bad);color:#fff;border-color:var(--bad)}
.s-pen{background:transparent;color:var(--muted);border-color:var(--field)}
.s-pau{background:repeating-linear-gradient(45deg,var(--mute-soft),var(--mute-soft) 3px,transparent 3px,transparent 6px);color:var(--muted);border-color:var(--field)}
.s-none{background:transparent;color:var(--line);border-style:dashed;border-color:var(--line)}
.m.hoy{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--brand-2)}
.leg{display:inline-flex;align-items:center;gap:6px}
.clist{display:flex;flex-direction:column;gap:12px}
.ccard{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.ch{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:flex-start}
.ch .grow{flex:1 1 260px;min-width:0}
.cb{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center}
.cnums{display:flex;flex-wrap:wrap;gap:8px 24px}
.cnums div{display:flex;flex-direction:column}
.cnums span{font-size:12px;color:var(--muted)}
.cnums b{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
@media (max-width:420px){.mstrip{grid-template-columns:repeat(12,minmax(0,1fr));gap:2px;width:100%}.m{width:auto;font-size:10px}}
.langs{display:inline-flex;border:1px solid var(--field);border-radius:10px;overflow:hidden;background:var(--surface)}
.langs button{border:none;background:transparent;color:var(--ink);min-height:40px;padding:0 12px;font-size:14px}
.langs button+button{border-inline-start:1px solid var(--field)}
.langs button[aria-pressed="true"]{background:var(--brand);color:#fff}
[dir="rtl"] .menu button{text-align:right}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #5B8DBF;outline-offset:2px}
.app{display:flex;flex-direction:column;min-height:100vh}
nav.side{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--brand);color:#fff;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px),3vw);padding-right:max(16px,env(safe-area-inset-right,0px),3vw);display:flex;align-items:center;gap:20px}

function impMes(v){

  var k = MESES.es.findIndex(function(m){ return s.indexOf(sinAcento(m).slice(0, 3)) === 0; });
  if(k !== -1) return k + 1;
  var d = s.match(/^(\d{4})-(\d{2})/) || s.match(/^\d{1,2}\/(\d{1,2})\/\d{2,4}$/);

      [['siguientes', 'Las siguientes pendientes'], ['ultimas', 'Las últimas'], ['elegir', 'Elegir cuotas']].map(function(x){ return '<label><input type="radio" name="pmModo" value="' + x[0] + '"' + (PM.modo === x[0] ? ' checked' : '') + '>' + x[1] + '</label>'; }).join('') + '</div></div>' +

function pmCalc(){
  var c = comp(PM.cid), monto = cents($('pmMonto').value), mon = $('pmMon').value, ref = cents($('pmTc').value), mc = mon === c.moneda ? monto : (monto > 0 ? ref : 0), tc = mon === c.moneda ? 1 : (ref > 0 && monto > 0 ? Math.round(monto / ref * 10000) / 10000 : 0);
  if($('pmTcL')) $('pmTcL').hidden = mon === c.moneda;
  var qs = cuotasDe(c.id).filter(function(q){ return falta(q) > 0 && !q.pausada; });
  if(PM.modo === 'ultimas') qs = qs.reverse();
  if(PM.modo === 'elegir') qs = qs.filter(function(q){ return PM.sel.indexOf(q.id) !== -1; });
  var rest = mc, plan = [];
  qs.forEach(function(q){ if(rest <= 0) return; var ap = Math.min(rest, falta(q)); plan.push({q: q, ap: ap}); rest -= ap; });
  return {c: c, monto: monto, mon: mon, mc: mc, tc: tc, plan: plan, sobra: rest};
}
function pmPrev(){
  var r = pmCalc(), c = r.c;

  }).join('') + '</tbody></table></div>' : '<div class="sub">Escribe el monto' + (PM.modo === 'elegir' ? ' y elige las cuotas' : '') + ' para ver cómo quedan.</div>') +

function edCalc(){

  if(gab === '__') gab = null; if(gab !== null && gab === (c.gabai || '')) gab = null; if(com !== null && com === (c.comisionPct || 0)) com = null;
  var antes = 0, despues = 0, filas = [];
  qs.forEach(function(q){
    if(!q.pausada) antes += q.montoC;
    var cambia = q.mes >= ED.desde, nuevo = cambia && nm > 0 ? nm : q.montoC;
    if(!q.pausada) despues += nuevo;
    if(cambia) filas.push({q: q, antes: q.montoC, despues: nuevo, pl: planQ(q)});
  });
  return {c: c, nm: nm, mon: mon, fo: fo, cj: cj, gab: gab, com: com, antes: antes, despues: despues, filas: filas};
}
function edPrev(){
  var r = edCalc(), c = r.c, hay = r.nm > 0 || r.mon || r.fo || r.cj;
  var cam = function(a, b){ return a === b ? esc(a) : '<s class="sub">' + esc(a) + '</s> <b>' + esc(b) + '</b>'; };
  $('edPrev').innerHTML =

      return '<tr><td>' + Mes(f.q.mes) + '</td><td class="n">' + mN(f.antes) + '</td><td class="n">' + (f.despues !== f.antes ? '<b style="color:' + (f.despues > f.antes ? 'var(--ok)' : 'var(--bad)') + '">' + mN(f.despues) + '</b>' : mN(f.despues)) + '</td>' +

    }).join('') + '</tbody></table></div>' +
    '<div class="row" style="margin-top:8px;gap:16px"><span>Total anual: <b>' + money(r.antes, c.moneda) + '</b> → <b>' + money(r.despues, c.moneda) + '</b></span>' +
    (r.despues !== r.antes ? '<span class="pill ' + (r.despues > r.antes ? 't-ok' : 't-bad') + '">' + (r.despues > r.antes ? 'Sube ' : 'Baja ') + money(Math.abs(r.despues - r.antes), c.moneda) + '</span>' : '') + (r.gab !== null ? '<span class="pill t-info">Gabai: ' + esc(r.gab || 'sin gabai') + '</span>' : '') + (r.com !== null ? '<span class="pill t-info">Comisión ' + r.com + '%</span>' : '') + '</div>';

function edSave(){
  var r = edCalc(), c = r.c, err = $('edErr'), mot = $('edMot').value.trim();
  if(!(r.nm > 0 || r.gab !== null || r.com !== null)){ err.textContent = 'No hay cambios: escribe la nueva cuota o elige qué cambia.'; err.hidden = false; return; }
  if(r.nm > 0 && r.nm === c.cuotaC && r.gab === null && r.com === null && r.filas.every(function(f){ return f.antes === r.nm; })){ err.textContent = 'La cuota nueva es igual a la actual.'; err.hidden = false; return; }
  if(!mot){ err.textContent = 'Escribe el motivo; queda en el historial.'; err.hidden = false; return; }
  var qs = cuotasDe(c.id);
  // fija lo que ya tenían los meses anteriores antes de mover los valores del compromiso
  qs.forEach(function(q){ if(q.mes < ED.desde){ var pl = planQ(q); q.pMon = pl.mon; q.pForma = pl.forma; q.pCaja = pl.mon === 'USD' ? pl.caja : null; } });
  var cambios = [];
  if(r.nm > 0 && r.filas.some(function(f){ return f.antes !== r.nm; })){ cambios.push('cuota de ' + money(c.cuotaC, c.moneda) + ' a ' + money(r.nm, c.moneda)); c.cuotaC = r.nm; }
  if(r.gab !== null){ cambios.push('gabai de ' + (c.gabai || 'sin gabai') + ' a ' + (r.gab || 'sin gabai')); c.gabai = r.gab; }
  if(r.com !== null){ cambios.push('comisión de ' + (c.comisionPct || 0) + '% a ' + r.com + '%'); c.comisionPct = r.com; }
  if(r.mon && r.mon !== (c.monPago || 'USD')){ cambios.push('paga en ' + r.mon); }
  if(r.fo && r.fo !== c.forma){ cambios.push('forma ' + r.fo); }
  if(r.cj && r.cj !== c.caja){ cambios.push('caja ' + caja(r.cj).nombre); }
  if(r.mon) c.monPago = r.mon; if(r.fo) c.forma = r.fo; if(r.cj) c.caja = r.cj;
  qs.forEach(function(q){
    if(q.mes < ED.desde) return;
    if(r.nm > 0) q.montoC = r.nm;
    if(r.mon) q.pMon = null; if(r.fo) q.pForma = null; if(r.cj) q.pCaja = null;
  });
  // los anteriores que coinciden con el valor del compromiso no necesitan quedar marcados
  qs.forEach(function(q){ if(q.mes < ED.desde){ if(q.pMon === (c.monPago || 'USD')) q.pMon = null; if(q.pForma === c.forma) q.pForma = null; if(q.pCaja === c.caja || q.pCaja == null) q.pCaja = null; } });
  recalcAnual(c);
  if(!cambios.length) cambios.push('sin cambio de valores');
  var desc = 'Desde ' + Mes(ED.desde) + ': ' + cambios.join('; ') + ' · total anual ' + money(r.antes, c.moneda) + ' → ' + money(c.anualC, c.moneda) + ' · motivo: ' + mot;
  c.ajustes.push({fecha: hoy(), usuario: user().nombre, desc: desc});
  log('Editó el compromiso de ' + don(c.donanteId).nombre + ': ' + desc);
  closeModal(); render(); toast('Compromiso editado desde ' + Mes(ED.desde));
}

  var camG = ng !== '__nc', camP = pv !== '', np2 = camP ? parseFloat(pv) : null;
  if(camP && (isNaN(np2) || np2 < 0 || np2 > 100)){ err.textContent = 'Escribe un % entre 0 y 100.'; err.hidden = false; return; }
  if(!camG && !camP){ err.textContent = 'Elige un gabai o un % de comisión para cambiar.'; err.hidden = false; return; }

  sel.forEach(function(id){ var q = S.cuotas.find(function(z){ return z.id === id; }); if(!q) return;

function ajSave(cid){
  var c = comp(cid), err = $('ajErr'), mot = $('ajMot').value.trim(), nc = $('ajCuota') ? cents($('ajCuota').value) : 0, desde = +($('ajDesde') ? $('ajDesde').value : 0);
  if(!mot){ err.textContent = 'Escribe el motivo del ajuste; queda en el historial.'; err.hidden = false; return; }
  var cambios = [];
  if(nc > 0 && nc !== c.cuotaC && desde){
    cuotasDe(cid).forEach(function(q){ if(q.mes >= desde && q.aplicadoC === 0 && !q.pausada) q.montoC = nc; });
    cambios.push('cuota de ' + money(c.cuotaC, c.moneda) + ' a ' + money(nc, c.moneda) + ' desde ' + Mes(desde));
    c.cuotaC = nc;
  }
  var pau = [], rea = [];
  document.querySelectorAll('[data-ajq]').forEach(function(x){ var q = S.cuotas.find(function(y){ return y.id === x.getAttribute('data-ajq'); }); if(q.pausada !== x.checked){ q.pausada = x.checked; (x.checked ? pau : rea).push(Mes(q.mes)); } });
  if(pau.length) cambios.push('pausa de ' + pau.join(', '));

  if(nMonP !== (c.monPago || 'USD')){ cambios.push('normalmente paga en ' + nMonP + ' (antes ' + (c.monPago || 'USD') + ')'); c.monPago = nMonP; }
  if(nForma !== c.forma){ cambios.push('forma de pago de ' + c.forma + ' a ' + nForma); c.forma = nForma; }
  if(nCaja !== c.caja){ cambios.push('caja de ' + caja(c.caja).nombre + ' a ' + caja(nCaja).nombre); c.caja = nCaja; }
  var nCom = Math.max(0, Math.min(100, parseFloat(String($('ajCom').value).replace(',', '.')) || 0)), nCon = $('ajCon').value;
  if(nCom !== (c.comisionPct || 0)){ cambios.push('comisión de ' + (c.comisionPct || 0) + '% a ' + nCom + '%'); c.comisionPct = nCom; }
  if(nCon && nCon !== c.concepto){ cambios.push('concepto de ' + (c.concepto || '—') + ' a ' + nCon); c.concepto = nCon; }
  if(nGab !== (c.gabai || '')){ cambios.push('gabai de ' + (c.gabai || 'sin asignar') + ' a ' + (nGab || 'sin asignar')); c.gabai = nGab; }

  recalcAnual(c);

  log('Ajustó el compromiso de ' + don(c.donanteId).nombre + ': ' + desc);
  closeModal(); render(); toast('Ajuste guardado en el historial');
}

/* Une tres versiones: lo último sincronizado (base), lo de este dispositivo (loc) y lo de la nube (rem). Gana lo que cambió. */
function nbUnir(base, loc, rem){
  if(!base) return loc;
  var out = {}, ks = {}; [base, loc, rem].forEach(function(o){ Object.keys(o || {}).forEach(function(k){ ks[k] = 1; }); });
  Object.keys(ks).forEach(function(k){
    var b = base[k], l = loc[k], r = rem[k], J = JSON.stringify;
    var conId = function(a){ return Array.isArray(a) && a.length && a.every(function(x){ return x && typeof x === 'object' && x.id != null; }); };
    if((conId(b) || conId(l) || conId(r)) && [b, l, r].every(function(a){ return a == null || Array.isArray(a); })){
      var mb = {}, ml = {}, mr = {}; (b || []).forEach(function(x){ mb[x.id] = x; }); (l || []).forEach(function(x){ ml[x.id] = x; }); (r || []).forEach(function(x){ mr[x.id] = x; });
      var res = [], vistos = {};
      var tomar = function(id){
        if(vistos[id]) return; vistos[id] = 1; var xb = mb[id], xl = ml[id], xr = mr[id];
        if(xb){ var lc = !xl || J(xl) !== J(xb), rc = !xr || J(xr) !== J(xb);
          if(lc && !rc){ if(xl) res.push(xl); } else if(!lc && rc){ if(xr) res.push(xr); } else if(lc && rc){ if(xl) res.push(xl); else if(xr) res.push(xr); } else res.push(xl); }
        else { if(xl) res.push(xl); else if(xr) res.push(xr); }
      };
      (l || []).forEach(function(x){ tomar(x.id); }); (r || []).forEach(function(x){ tomar(x.id); });
      out[k] = res;
    } else if(k === 'bitacora' && Array.isArray(l) && Array.isArray(r)){
      var vis = {}, lst = []; l.concat(r).forEach(function(x){ var q = J(x); if(!vis[q]){ vis[q] = 1; lst.push(x); } });
      lst.sort(function(a, c){ return String(c.fecha || '').localeCompare(String(a.fecha || '')); }); out[k] = lst.slice(0, 3000);
    } else if(k === 'seq' || k === 'recibo' || k === 'folioEg'){ out[k] = Math.max(+l || 0, +r || 0); }
    else { out[k] = J(l) !== J(b) ? l : r; }
    if(out[k] === undefined) delete out[k];
  });
  return out;
}
async function nbRevisar(){

/* ================= Buscador con sugerencias en las listas de donadores ================= */
var BUSCA_IDS = ['portalSel', 'donSel', 'segDon', 'cclDon', 'ccDon', 'comDon', 'contDon', 'aprDon', 'bkDon', 'rgDon'];
function buscaNorm(t){ return sinAcento(String(t || '')).toLowerCase(); }
function buscaMejorar(){
  BUSCA_IDS.forEach(function(id){
    var sel = document.getElementById(id); if(!sel || sel.getAttribute('data-busca')) return;
    sel.setAttribute('data-busca', '1');
    var vacia = Array.prototype.find.call(sel.options, function(o){ return o.value === ''; });
    var w = document.createElement('div'); w.className = 'busca';
    var inp = document.createElement('input'); inp.type = 'search'; inp.autocomplete = 'off'; inp.spellcheck = false; inp.setAttribute('data-noi18n', '');
    inp.placeholder = '🔎 Escribe un nombre…';
    var lst = document.createElement('div'); lst.className = 'buscaLista'; lst.hidden = true; lst.setAttribute('data-noi18n', '');
    w.appendChild(inp); w.appendChild(lst); var fila = document.createElement('div'); fila.className = 'buscaFila'; sel.parentNode.insertBefore(fila, sel); fila.appendChild(sel); fila.appendChild(w); var lb = fila.closest('label'); if(lb && lb.style.maxWidth) lb.style.maxWidth = '760px'; if(lb && lb.parentNode && getComputedStyle(lb.parentNode).display === 'grid' && innerWidth > 700) lb.style.gridColumn = 'span 2'; sel.addEventListener('change', function(){ inp.value = actual(); });
    var actual = function(){ var o = sel.options[sel.selectedIndex]; return o && o.value !== '' ? o.text : ''; };
    inp.value = actual();
    var act = -1, items = [];
    var elegir = function(v){ lst.hidden = true; if(sel.value !== v){ sel.value = v; sel.dispatchEvent(new Event('change', {bubbles: true})); } inp.value = actual(); };
    var pintar = function(){
      var q = buscaNorm(inp.value).trim(), pal = q ? q.split(/\s+/) : [];
      items = Array.prototype.filter.call(sel.options, function(o){ if(o.value === '') return !q; var t = buscaNorm(o.text); return pal.every(function(p){ return t.indexOf(p) !== -1; }); }).slice(0, 60);
      act = items.length ? 0 : -1;
      lst.innerHTML = items.length ? items.map(function(o, k){
        var t = esc(o.text); if(pal.length){ var n = buscaNorm(o.text), i = n.indexOf(pal[0]); if(i !== -1) t = esc(o.text.slice(0, i)) + '<b>' + esc(o.text.slice(i, i + pal[0].length)) + '</b>' + esc(o.text.slice(i + pal[0].length)); }
        return '<button type="button" data-k="' + k + '"' + (k === act ? ' class="act"' : '') + '>' + t + '</button>';
      }).join('') : '<div class="vacio">No hay donadores con “' + esc(inp.value) + '”</div>';
      lst.hidden = false;
    };
    inp.addEventListener('focus', function(){ inp.select(); pintar(); });
    inp.addEventListener('input', function(e){ e.stopPropagation(); pintar(); });
    inp.addEventListener('change', function(e){ e.stopPropagation(); });
    inp.addEventListener('keydown', function(e){
      if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); if(!items.length) return; act = (act + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; Array.prototype.forEach.call(lst.children, function(b, k){ b.classList.toggle('act', k === act); if(k === act) b.scrollIntoView({block: 'nearest'}); }); }
      else if(e.key === 'Enter'){ e.preventDefault(); e.stopPropagation(); if(act >= 0 && items[act]) elegir(items[act].value); }
      else if(e.key === 'Escape'){ lst.hidden = true; inp.value = actual(); inp.blur(); }
    });
    lst.addEventListener('mousedown', function(e){ e.preventDefault(); });
    lst.addEventListener('click', function(e){ e.stopPropagation(); var b = e.target.closest('button[data-k]'); if(b) elegir(items[+b.getAttribute('data-k')].value); });
    inp.addEventListener('blur', function(){ setTimeout(function(){ lst.hidden = true; if(!inp.value.trim() && vacia && sel.value !== ''){ elegir(''); } else inp.value = actual(); }, 120); });
  });
}
(function(){ var pend = false; new MutationObserver(function(){ if(pend) return; pend = true; Promise.resolve().then(function(){ pend = false; buscaMejorar(); }); }).observe(document.body, {childList: true, subtree: true}); })();
